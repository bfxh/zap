[package]
name = "zap"
version = "0.3.2"
edition = "2021"
description = "Portable multithreaded PPMd archiver"
default-run = "zap"
license = "MIT OR Apache-2.0"

[lib]
name = "zap"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "zap"
path = "src/main.rs"

[dependencies]
ppmd-turbo = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
