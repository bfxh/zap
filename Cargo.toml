[package]
name = "zap"
version = "0.1.0"
edition = "2021"
description = "Portable multithreaded PPMd archiver"

[lib]
name = "zap"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "zap"
path = "src/main.rs"

[dependencies]
ppmd-turbo = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
